<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라이센스 관리자 패널</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; color: #7AB7FF; margin-bottom: 20px; }

  .login-box, .panel { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  .panel { display: none; }

  label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; }
  input, select { width: 100%; padding: 10px 12px; background: #111; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 14px; margin-bottom: 14px; outline: none; }
  input:focus, select:focus { border-color: #7AB7FF; }

  .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #7AB7FF; color: #000; }
  .btn-danger { background: #FF6B6B; color: #fff; }
  .btn-warning { background: #FFA94D; color: #000; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-group { display: flex; gap: 6px; }

  .issue-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
  .issue-form > div { flex: 1; min-width: 140px; }
  .issue-form .btn { margin-bottom: 14px; white-space: nowrap; }

  .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
  .toast.success { background: #2d5a27; color: #69DB7C; border: 1px solid #3a7a32; }
  .toast.error { background: #5a2727; color: #FF6B6B; border: 1px solid #7a3232; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 12px; color: #666; border-bottom: 1px solid #2a2a2a; text-transform: uppercase; }
  td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #1f1f1f; }
  tr:hover td { background: #1f1f1f; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-active { background: #1a3a1a; color: #69DB7C; }
  .badge-expired { background: #3a1a1a; color: #FF6B6B; }
  .badge-disabled { background: #3a3a1a; color: #FFA94D; }

  .key-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; word-break: break-all; }
  .memo-text { color: #888; font-size: 12px; }
  .empty-state { text-align: center; padding: 40px; color: #555; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; }
  .stat-card { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: #7AB7FF; }
  .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>라이센스 관리자 패널</h1>

  <div class="login-box" id="loginBox">
    <label>관리자 키</label>
    <input type="password" id="adminKeyInput" placeholder="ADMIN_KEY를 입력하세요" />
    <button class="btn btn-primary" onclick="login()">로그인</button>
  </div>

  <div class="panel" id="panel">
    <div class="stats" id="stats"></div>

    <div class="panel" id="issuePanel" style="display:block; padding:0; border:none; background:none; margin-bottom:20px;">
      <h3 style="font-size:15px; margin-bottom:12px; color:#ccc;">라이센스 발급</h3>
      <div class="issue-form">
        <div>
          <label>라이센스 키</label>
          <input type="text" id="newKey" placeholder="키 입력 또는 자동 생성" />
        </div>
        <div style="min-width:100px; flex:0.5;">
          <label>기간</label>
          <select id="newDays">
            <option value="h1">1시간</option>
            <option value="h3">3시간</option>
            <option value="h6">6시간</option>
            <option value="h12">12시간</option>
            <option value="h24">24시간</option>
            <option value="1">1일</option>
            <option value="7">7일</option>
            <option value="30" selected>30일</option>
            <option value="99999">무제한</option>
          </select>
        </div>
        <div>
          <label>메모</label>
          <input type="text" id="newMemo" placeholder="선택사항" />
        </div>
        <button class="btn btn-primary" onclick="issueKey()" style="margin-bottom:14px;">발급</button>
        <button class="btn btn-warning" onclick="generateRandomKey()" style="margin-bottom:14px;">자동생성</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>키</th>
          <th>기간</th>
          <th>상태</th>
          <th>만료일</th>
          <th>메모</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="licenseTable"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">등록된 라이센스가 없습니다.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminKey = '';
const API = '/api/admin';

function login() {
  adminKey = document.getElementById('adminKeyInput').value.trim();
  if (!adminKey) return showToast('관리자 키를 입력하세요.', 'error');
  loadLicenses();
}

function headers() {
  return { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey };
}

async function loadLicenses() {
  try {
    const res = await fetch(API, { headers: headers() });
    const data = await res.json();
    if (!data.success) return showToast(data.message, 'error');

    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    renderStats(data.licenses);
    renderTable(data.licenses);
  } catch (e) {
    showToast('서버 연결 실패', 'error');
  }
}

function renderStats(list) {
  const total = list.length;
  const active = list.filter(l => !l.expired && !l.disabled).length;
  const expired = list.filter(l => l.expired).length;
  const disabled = list.filter(l => l.disabled).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">전체</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#69DB7C">${active}</div><div class="stat-label">활성</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#FF6B6B">${expired}</div><div class="stat-label">만료</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#FFA94D">${disabled}</div><div class="stat-label">비활성</div></div>
  `;
}

function renderTable(list) {
  const tbody = document.getElementById('licenseTable');
  const empty = document.getElementById('emptyState');
  if (!list.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = list.map(l => {
    let badge;
    if (l.disabled) badge = '<span class="badge badge-disabled">비활성</span>';
    else if (l.expired) badge = '<span class="badge badge-expired">만료</span>';
    else badge = '<span class="badge badge-active">활성</span>';

    // 시간권은 날짜만 찍으면 언제 끝나는지 알 수 없어 시:분까지 보여준다.
    const isHourly = Number(l.hours || 0) > 0;
    const exp = isHourly
      ? new Date(l.expiresAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : new Date(l.expiresAt).toLocaleDateString('ko-KR');
    const toggleLabel = l.disabled ? '활성화' : '비활성화';
    const toggleClass = l.disabled ? 'btn-primary' : 'btn-warning';

    return `<tr>
      <td class="key-text">${l.key}</td>
      <td>${l.term || (l.days === 99999 ? '무제한' : l.days + '일')}</td>
      <td>${badge}</td>
      <td>${l.days === 99999 ? '-' : exp}</td>
      <td class="memo-text">${l.memo || '-'}</td>
      <td class="btn-group">
        <button class="btn ${toggleClass} btn-sm" onclick="toggleKey('${l.key}', ${!l.disabled})">${toggleLabel}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteKey('${l.key}')">삭제</button>
      </td>
    </tr>`;
  }).join('');
}

async function issueKey() {
  const key = document.getElementById('newKey').value.trim();
  // 'h' 접두사면 시간권(hours), 아니면 기존처럼 일권(days). 서버는 둘 중 하나만 받는다.
  const raw = document.getElementById('newDays').value;
  const body = raw.startsWith('h')
    ? { hours: parseInt(raw.slice(1), 10) }
    : { days: parseInt(raw, 10) };
  const memo = document.getElementById('newMemo').value.trim();
  if (!key) return showToast('라이센스 키를 입력하세요.', 'error');

  try {
    const res = await fetch(API, { method: 'POST', headers: headers(), body: JSON.stringify({ key, ...body, memo }) });
    const data = await res.json();
    showToast(data.message, data.success ? 'success' : 'error');
    if (data.success) { document.getElementById('newKey').value = ''; document.getElementById('newMemo').value = ''; loadLicenses(); }
  } catch (e) { showToast('발급 실패', 'error'); }
}

async function deleteKey(key) {
  if (!confirm(`"${key}" 키를 삭제하시겠습니까?`)) return;
  try {
    const res = await fetch(API, { method: 'DELETE', headers: headers(), body: JSON.stringify({ key }) });
    const data = await res.json();
    showToast(data.message, data.success ? 'success' : 'error');
    if (data.success) loadLicenses();
  } catch (e) { showToast('삭제 실패', 'error'); }
}

async function toggleKey(key, disabled) {
  try {
    const res = await fetch(API, { method: 'PATCH', headers: headers(), body: JSON.stringify({ key, disabled }) });
    const data = await res.json();
    showToast(data.message, data.success ? 'success' : 'error');
    if (data.success) loadLicenses();
  } catch (e) { showToast('수정 실패', 'error'); }
}

function generateRandomKey() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const parts = [];
  for (let p = 0; p < 5; p++) {
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    parts.push(s);
  }
  document.getElementById('newKey').value = parts.join('-');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('adminKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
